<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15120f" />
  <meta name="robots" content="noindex,nofollow" />
  <title>SERVICE ELEVATOR / FLOOR ∞</title>
  <style>
    :root{--ink:#efe5cf;--panel:#211d18;--edge:#52483a;--accent:#d1a94d;--glow:rgba(209,169,77,.38)}
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}body{overflow:hidden;color:var(--ink);background:radial-gradient(circle at 12% 10%,rgba(255,255,255,.045),transparent 24rem),#0f0d0b;font-family:"Courier New",ui-monospace,monospace;user-select:none}button{font:inherit}
    .grain{position:fixed;inset:0;pointer-events:none;opacity:.12;z-index:100;background-image:repeating-radial-gradient(circle at 0 0,transparent 0,rgba(255,255,255,.08) 1px,transparent 2px,transparent 5px);background-size:7px 7px;mix-blend-mode:overlay}
    .shell{width:100vw;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 310px;background:linear-gradient(90deg,#17130f,#0c0b0a 72%)}
    .shaft{min-width:0;min-height:0;position:relative;isolation:isolate;border-right:1px solid #3a3127;box-shadow:inset -30px 0 60px rgba(0,0,0,.45)}
    .scene{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;transition:background .8s ease;background:#18130f}.scene-content{position:relative;z-index:2;width:min(80%,720px);min-height:50%;display:grid;place-items:center;text-align:center;padding:2rem;opacity:1;transform:translateY(0);transition:opacity .35s ease,transform .55s cubic-bezier(.2,.8,.2,1)}.scene.changing .scene-content{opacity:0;transform:translateY(12px) scale(.98)}.scene h1,.scene h2,.scene p{margin:0}.scene h1{font-size:clamp(2rem,6vw,6rem);letter-spacing:-.05em;line-height:.9}.scene h2{font-size:clamp(1.1rem,2.2vw,2rem);letter-spacing:.12em;text-transform:uppercase}.scene p{max-width:44rem;margin-top:1.25rem;line-height:1.6;color:rgba(255,255,255,.72);font-size:clamp(.84rem,1.2vw,1rem)}
    .door-frame{position:absolute;z-index:12;inset:28px 28px 22px;border:18px solid #2d2822;border-bottom-width:24px;box-shadow:0 0 0 2px #17130f,inset 0 0 0 2px #5f5548,inset 0 0 90px rgba(0,0,0,.4),0 18px 60px rgba(0,0,0,.48);pointer-events:none}.door{position:absolute;z-index:10;top:46px;bottom:46px;width:calc(50% - 28px);background:linear-gradient(90deg,rgba(255,255,255,.08),transparent 14%,rgba(0,0,0,.08) 45%,rgba(255,255,255,.03) 70%,rgba(0,0,0,.16)),repeating-linear-gradient(0deg,transparent 0 4px,rgba(255,255,255,.02) 5px),#45403a;box-shadow:inset 0 0 45px rgba(0,0,0,.45);transition:transform 1.05s cubic-bezier(.76,0,.24,1)}.door.left{left:28px;transform:translateX(-100%);border-right:1px solid #191613}.door.right{right:28px;transform:translateX(100%);border-left:1px solid #191613}.doors-closed .door.left,.doors-closed .door.right{transform:translateX(0)}
    .floor-plaque{position:absolute;z-index:20;top:15px;left:50%;transform:translateX(-50%);background:#13110f;border:1px solid #4f4436;border-radius:3px;padding:.42rem 1.1rem .32rem;color:#e7bb54;letter-spacing:.24em;font-size:.74rem;box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 0 12px rgba(209,169,77,.08);text-shadow:0 0 10px var(--glow);white-space:nowrap}
    .panel{position:relative;min-height:0;padding:26px 22px 22px;background:linear-gradient(90deg,rgba(255,255,255,.025),transparent 22%,rgba(0,0,0,.18)),repeating-linear-gradient(90deg,transparent 0 12px,rgba(255,255,255,.012) 13px),#211d18;box-shadow:inset 1px 0 #655a4d,inset 16px 0 28px rgba(255,255,255,.018);display:flex;flex-direction:column;gap:16px;overflow:auto;scrollbar-width:none}.panel::-webkit-scrollbar{display:none}.brand{padding:0 2px 8px;border-bottom:1px solid #4b4238}.brand strong{display:block;color:#e7d8bb;font:700 .8rem/1.1 Arial,sans-serif;letter-spacing:.2em}.brand span{display:block;margin-top:5px;color:#7d7262;font-size:.58rem;letter-spacing:.15em}
    .indicator{position:relative;overflow:hidden;border:1px solid #514535;background:#090807;min-height:92px;padding:12px;box-shadow:inset 0 0 28px rgba(0,0,0,.85),0 4px 14px rgba(0,0,0,.3)}.indicator::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 4px)}.ind-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.floor-number{color:#f0b93f;font-size:2.8rem;font-weight:700;line-height:.95;text-shadow:0 0 13px rgba(240,185,63,.46)}.direction{color:#8e742f;font-size:1.3rem}.status{margin-top:7px;color:#806f52;font-size:.62rem;line-height:1.4;letter-spacing:.12em;text-transform:uppercase}
    .button-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:10px 4px}.floor-btn{position:relative;aspect-ratio:1;border:none;border-radius:50%;background:radial-gradient(circle at 38% 32%,#625c54 0 5%,#403b35 28%,#1d1a17 65%,#0b0a09 100%);box-shadow:inset 0 0 0 2px #71695d,inset 0 0 0 6px #1b1815,0 5px 0 #090807,0 8px 16px rgba(0,0,0,.42);color:#d8d0c0;cursor:pointer;font-size:1.15rem;font-weight:700;transition:transform .12s ease,filter .2s ease,color .2s ease;-webkit-tap-highlight-color:transparent}.floor-btn:hover{filter:brightness(1.18)}.floor-btn:active{transform:translateY(3px)}.floor-btn.active{color:#ffd86c;text-shadow:0 0 10px #e7b84c;box-shadow:inset 0 0 0 2px #b38d3c,inset 0 0 0 6px #1b1815,inset 0 0 20px rgba(231,184,76,.18),0 5px 0 #090807,0 0 18px rgba(231,184,76,.22)}.floor-btn.locked{color:#635c51;cursor:not-allowed;filter:saturate(.3) brightness(.7)}.floor-btn.locked::after{content:"LOCKED";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);font-size:.4rem;letter-spacing:.16em;color:#6c6252}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tiny-btn{min-height:40px;border:1px solid #51483c;background:#181512;color:#988b78;cursor:pointer;font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;box-shadow:inset 0 1px rgba(255,255,255,.035),0 2px 5px rgba(0,0,0,.35)}.tiny-btn:hover{color:#d5c8b2;background:#1f1a16}.notice{margin-top:auto;padding:10px 2px 0;border-top:1px solid #40382f;color:#716656;font-size:.54rem;line-height:1.5;letter-spacing:.09em;text-transform:uppercase}.notice .dot{display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:#a33d34;box-shadow:0 0 8px rgba(196,64,51,.7);animation:blink 1.7s steps(2,end) infinite}@keyframes blink{50%{opacity:.22}}
    .scene[data-floor="0"]{background:linear-gradient(180deg,rgba(255,225,180,.05),transparent 40%),linear-gradient(110deg,#33302d,#191817 65%,#0e0d0c)}.lobby-card{width:min(540px,90%);padding:clamp(1.5rem,4vw,3rem);border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.2);box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:left}.lobby-card .line{height:1px;background:rgba(255,255,255,.16);margin:1.4rem 0}.plant{position:absolute;right:8%;bottom:8%;width:72px;height:130px;opacity:.5}.plant::before{content:"";position:absolute;left:22px;bottom:0;width:42px;height:52px;background:linear-gradient(90deg,#2d2925,#171513);clip-path:polygon(0 0,100% 0,82% 100%,18% 100%)}.plant::after{content:"";position:absolute;left:34px;bottom:44px;width:45px;height:78px;background:#313a2a;clip-path:polygon(44% 100%,40% 55%,0 34%,38% 42%,18% 5%,48% 32%,72% 0,58% 40%,100% 24%,62% 55%,58% 100%)}
    .scene[data-floor="-1"]{background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 38px),linear-gradient(125deg,#241c15,#100d0a 75%)}.archive{position:relative;width:min(720px,94%);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;perspective:900px}.drawer{height:clamp(62px,10vw,92px);border:1px solid #5a4937;background:linear-gradient(#4a3c2f,#2b231c);box-shadow:inset 0 0 22px rgba(0,0,0,.28),0 7px 14px rgba(0,0,0,.18);position:relative}.drawer::before{content:"";position:absolute;width:34%;height:14%;top:15%;left:33%;border:1px solid #8d7456;background:#201a15}.drawer::after{content:attr(data-id);position:absolute;left:50%;bottom:12%;transform:translateX(-50%);color:#b9a17e;font-size:.55rem}.archive-note{position:absolute;right:4%;top:-22%;transform:rotate(4deg);background:#d8c9a8;color:#231d16;width:170px;padding:14px;text-align:left;font-size:.62rem;line-height:1.45;box-shadow:0 8px 20px rgba(0,0,0,.35)}
    .scene[data-floor="7"]{background:linear-gradient(180deg,#121827,#19283a 52%,#0a0f17)}.rain{position:absolute;inset:-20%;pointer-events:none;background-image:repeating-linear-gradient(103deg,transparent 0 18px,rgba(179,210,255,.15) 19px,transparent 20px 42px);animation:rainMove .5s linear infinite;opacity:.7}@keyframes rainMove{to{transform:translate(-30px,60px)}}.weather-box{border-left:3px solid rgba(190,217,255,.55);padding:1.5rem 1.8rem;text-align:left;backdrop-filter:blur(5px);background:rgba(5,9,15,.2)}.weather-temp{font-size:clamp(4rem,12vw,9rem);line-height:.8;letter-spacing:-.09em;color:#d8e6f7}.lightning{position:absolute;inset:0;background:rgba(220,235,255,.6);opacity:0;pointer-events:none}.flash{animation:flash .35s ease-out}@keyframes flash{0%,100%{opacity:0}15%{opacity:.72}28%{opacity:.08}45%{opacity:.38}}
    .scene[data-floor="13"]{background:radial-gradient(circle at 50% 10%,rgba(113,231,255,.18),transparent 30%),linear-gradient(180deg,#0d3240,#08232c 55%,#020c11)}.bubble{position:absolute;bottom:-40px;width:var(--s);height:var(--s);border-radius:50%;border:1px solid rgba(192,243,255,.45);box-shadow:inset -3px -3px 8px rgba(255,255,255,.1);left:var(--x);animation:rise var(--d) linear infinite;animation-delay:var(--delay);opacity:.65}@keyframes rise{to{transform:translateY(-120vh) translateX(var(--drift));opacity:.05}}.fish{position:absolute;width:70px;height:30px;left:-120px;top:var(--y);opacity:.5;animation:swim var(--speed) linear infinite}.fish::before{content:"";position:absolute;width:48px;height:26px;left:18px;top:2px;border-radius:60% 40% 40% 60%;background:rgba(116,178,178,.46)}.fish::after{content:"";position:absolute;left:0;top:5px;width:22px;height:22px;background:rgba(116,178,178,.4);clip-path:polygon(0 0,100% 50%,0 100%)}@keyframes swim{to{transform:translateX(calc(100vw + 240px))}}
    .scene[data-floor="?"]{background:linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),#080808;background-size:30px 30px}.maintenance{width:min(600px,92%);text-align:left;border:1px solid #242424;padding:1.5rem;background:rgba(0,0,0,.72)}.maintenance .red{color:#d35c4d}.maintenance ol{color:#858585;line-height:1.8;padding-left:1.2rem}.maintenance code{color:#b7b7b7}
    .scene[data-floor="∞"]{background:#000}#starfield{position:absolute;inset:0;width:100%;height:100%;z-index:0}.infinity{position:relative;z-index:2;text-align:center;mix-blend-mode:screen}.infinity h1{font-size:clamp(7rem,28vw,20rem);line-height:.55;font-family:Georgia,serif;font-weight:400;text-shadow:0 0 40px rgba(255,255,255,.32)}.infinity p{color:rgba(255,255,255,.56);letter-spacing:.18em;text-transform:uppercase;font-size:.7rem}.secret-tag{display:inline-block;margin-top:1.2rem;border:1px solid rgba(255,255,255,.2);padding:.5rem .8rem;color:rgba(255,255,255,.38);font-size:.54rem;letter-spacing:.16em}
    .hint{position:absolute;z-index:25;left:50%;bottom:66px;transform:translateX(-50%);pointer-events:none;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.68);padding:.5rem .75rem;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:opacity .3s ease,transform .3s ease}.hint.show{opacity:1;transform:translateX(-50%) translateY(-6px)}.shake{animation:shake .38s linear}@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,1px)}40%{transform:translate(4px,-1px)}60%{transform:translate(-2px,2px)}80%{transform:translate(2px,-1px)}}
    @media(max-width:760px){body{overflow:auto}.shell{min-height:100dvh;height:auto;grid-template-columns:1fr;grid-template-rows:minmax(64dvh,1fr) auto}.shaft{min-height:64dvh;border-right:0;border-bottom:1px solid #3a3127}.panel{overflow:visible;padding:18px 16px 24px}.door-frame{inset:16px 16px 14px;border-width:12px;border-bottom-width:18px}.door{top:28px;bottom:32px;width:calc(50% - 16px)}.door.left{left:16px}.door.right{right:16px}.floor-plaque{top:5px}.indicator{min-height:76px}.floor-number{font-size:2.2rem}.button-grid{grid-template-columns:repeat(3,1fr);gap:12px}.notice{margin-top:8px}.hint{bottom:44px}.archive{grid-template-columns:repeat(4,1fr)}.drawer:nth-child(n+13){display:none}.archive-note{top:-32%;right:2%}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <div class="grain"></div>
  <main class="shell" id="shell">
    <section class="shaft" id="shaft" aria-live="polite">
      <div class="scene" id="scene" data-floor="0"><div class="scene-content" id="sceneContent"></div></div>
      <div class="door left" aria-hidden="true"></div><div class="door right" aria-hidden="true"></div><div class="door-frame" aria-hidden="true"></div>
      <div class="floor-plaque">SERVICE ELEVATOR // UNIT 04</div><div class="hint" id="hint">Sequence accepted.</div>
    </section>
    <aside class="panel">
      <div class="brand"><strong>OTIS // NOT OTIS</strong><span>BUILD 1979.13 / SERVICE PANEL</span></div>
      <div class="indicator" aria-label="elevator status"><div class="ind-row"><div class="floor-number" id="floorNumber">0</div><div class="direction" id="direction">◆</div></div><div class="status" id="status">Doors open. Choose a floor.</div></div>
      <div class="button-grid" id="buttons">
        <button class="floor-btn" data-target="-1" aria-label="Floor minus one">-1</button><button class="floor-btn active" data-target="0">0</button><button class="floor-btn" data-target="7">7</button><button class="floor-btn" data-target="13">13</button><button class="floor-btn" data-target="?">?</button><button class="floor-btn locked" id="infinityBtn" data-target="∞" aria-disabled="true">∞</button>
      </div>
      <div class="controls"><button class="tiny-btn" id="doorBtn">Close doors</button><button class="tiny-btn" id="alarmBtn">Alarm</button></div>
      <div class="notice"><span class="dot"></span> Camera offline since 03:17<br>Do not stop between floors.<br>Do not press the same floor twice.</div>
    </aside>
  </main>
  <script>
  (()=>{
    const shell=document.getElementById('shell'),shaft=document.getElementById('shaft'),scene=document.getElementById('scene'),content=document.getElementById('sceneContent'),number=document.getElementById('floorNumber'),direction=document.getElementById('direction'),status=document.getElementById('status'),buttons=[...document.querySelectorAll('.floor-btn')],infinityBtn=document.getElementById('infinityBtn'),doorBtn=document.getElementById('doorBtn'),alarmBtn=document.getElementById('alarmBtn'),hint=document.getElementById('hint');
    let currentFloor='0',busy=false,doorsClosed=false,sequence=[],unlocked=localStorage.getItem('floor-infinity-unlocked')==='yes',starAnim=null,stormTimer=null,alarmContext=null;
    const required=['7','13','-1','0'];
    const scenes={
      '0':()=>`<div class="lobby-card"><h2>Ground Floor</h2><div class="line"></div><p style="margin-top:0">The lobby is empty. The clock above reception has no hands.</p><p>There is a service elevator behind you. You are already inside it.</p></div><div class="plant" aria-hidden="true"></div>`,
      '-1':()=>{let d='';for(let i=0;i<20;i++){const id=String.fromCharCode(65+(i%6))+'-'+String(104+i*7).padStart(3,'0');d+=`<div class="drawer" data-id="${id}"></div>`}return `<div><h2>Archive</h2><p style="margin:.7rem auto 1.8rem">Nothing stored here has happened yet.</p><div class="archive">${d}<div class="archive-note">ARCHIVE RULE 04:<br><br>DO NOT INDEX FLOOR ∞.<br><br>If the elevator asks for a sequence, forget you saw this note.</div></div></div>`},
      '7':()=>`<div class="rain"></div><div class="lightning" id="lightning"></div><div class="weather-box"><div class="weather-temp">7°</div><h2>Indoor Weather</h2><p>The forecast says rain inside the building until further notice.</p><p>Chance of hallway: 82%.</p></div>`,
      '13':()=>{let b='',f='';for(let i=0;i<24;i++){const s=5+(i*7%22),x=(i*41%96)+'%',d=8+(i*3%10)+'s',delay=-(i*1.17%12)+'s',drift=((i%2?1:-1)*(8+i%18))+'px';b+=`<span class="bubble" style="--s:${s}px;--x:${x};--d:${d};--delay:${delay};--drift:${drift}"></span>`}for(let i=0;i<4;i++)f+=`<span class="fish" style="--y:${20+i*18}%;--speed:${12+i*5}s;animation-delay:-${i*4}s"></span>`;return `${b}${f}<div><h1 style="font-family:Georgia,serif;font-weight:400">13</h1><h2 style="margin-top:1rem">Water Level</h2><p>The doors are rated for 30 meters.<br>You are not 30 meters below anything.</p></div>`},
      '?':()=>`<div class="maintenance"><h2 class="red">Maintenance access</h2><p>Diagnostic camera: <strong class="red">OFFLINE</strong></p><ol><li>Verify door interlock.</li><li>Ignore knocks from shaft wall.</li><li>Calibration sequence: <code>7 → 13 → -1 → 0</code></li><li>If ∞ appears, do not acknowledge it.</li></ol><p style="font-size:.66rem">Technician note: The panel sometimes remembers visitors.</p></div>`,
      '∞':()=>`<canvas id="starfield"></canvas><div class="infinity"><h1>∞</h1><p>There is no building outside these doors.</p><span class="secret-tag">You found the floor that is not on the plan.</span></div>`
    };
    function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function numericFloor(v){if(v==='?')return 4;if(v==='∞')return 999;return Number(v)}
    function flashHint(t){hint.textContent=t;hint.classList.add('show');clearTimeout(flashHint.t);flashHint.t=setTimeout(()=>hint.classList.remove('show'),1800)}
    function setDoors(c){doorsClosed=c;shaft.classList.toggle('doors-closed',c);doorBtn.textContent=c?'Open doors':'Close doors'}
    function stopEffects(){if(stormTimer)clearInterval(stormTimer);stormTimer=null;if(starAnim)cancelAnimationFrame(starAnim);starAnim=null}
    function startStorm(){const l=document.getElementById('lightning');if(!l)return;stormTimer=setInterval(()=>{if(Math.random()>.58){l.classList.remove('flash');void l.offsetWidth;l.classList.add('flash')}},1100)}
    function startStars(){const c=document.getElementById('starfield');if(!c)return;const x=c.getContext('2d');let w=0,h=0,cx=0,cy=0;const stars=Array.from({length:260},()=>({x:(Math.random()-.5)*2,y:(Math.random()-.5)*2,z:Math.random()*.95+.05,pz:1}));const resize=()=>{const d=Math.min(devicePixelRatio||1,2);w=c.clientWidth;h=c.clientHeight;c.width=Math.floor(w*d);c.height=Math.floor(h*d);x.setTransform(d,0,0,d,0,0);cx=w/2;cy=h/2};resize();addEventListener('resize',resize,{once:true});function frame(){x.fillStyle='rgba(0,0,0,.25)';x.fillRect(0,0,w,h);x.strokeStyle='rgba(255,255,255,.68)';for(const s of stars){s.pz=s.z;s.z-=.009;if(s.z<.03){s.x=(Math.random()-.5)*2;s.y=(Math.random()-.5)*2;s.z=.98;s.pz=s.z}const xx=cx+(s.x/s.z)*cx,yy=cy+(s.y/s.z)*cy,px=cx+(s.x/s.pz)*cx,py=cy+(s.y/s.pz)*cy;if(xx< -100||xx>w+100||yy< -100||yy>h+100)continue;x.beginPath();x.moveTo(px,py);x.lineTo(xx,yy);x.stroke()}starAnim=requestAnimationFrame(frame)}frame()}
    function renderFloor(f){stopEffects();scene.dataset.floor=f;content.innerHTML=scenes[f]();if(f==='7')startStorm();if(f==='∞')startStars()}
    function updateSequence(f){if(f==='?')return;sequence.push(f);sequence=sequence.slice(-4);if(!unlocked&&sequence.join('|')===required.join('|')){unlocked=true;localStorage.setItem('floor-infinity-unlocked','yes');infinityBtn.classList.remove('locked');infinityBtn.setAttribute('aria-disabled','false');infinityBtn.classList.add('active');number.textContent='∞';status.textContent='Unlisted stop detected.';shell.classList.add('shake');setTimeout(()=>shell.classList.remove('shake'),500);flashHint('New floor added to panel.');setTimeout(()=>{infinityBtn.classList.remove('active');number.textContent=currentFloor;status.textContent='Doors open. Choose a floor.'},1500)}}
    function randomTransit(t){if(t==='?'||t==='∞')return['--','?','ERR','04','…'][Math.floor(Math.random()*5)];const a=numericFloor(currentFloor),b=numericFloor(t),min=Math.min(a,b),max=Math.max(a,b);return String(Math.floor(min+Math.random()*(max-min+1)))}
    async function travelTo(t){if(busy||t===currentFloor){if(t===currentFloor)flashHint('You are already here.');return}if(t==='∞'&&!unlocked){status.textContent='Access denied.';shell.classList.add('shake');setTimeout(()=>shell.classList.remove('shake'),450);flashHint('The button does not exist yet.');return}busy=true;buttons.forEach(b=>b.disabled=true);status.textContent='Closing doors…';setDoors(true);await sleep(1050);scene.classList.add('changing');direction.textContent=t==='?'||t==='∞'?'◇':numericFloor(t)>numericFloor(currentFloor)?'▲':'▼';status.textContent='Moving…';for(let i=0;i<5+Math.floor(Math.random()*4);i++){await sleep(130+Math.random()*150);number.textContent=randomTransit(t)}currentFloor=t;number.textContent=t;direction.textContent='◆';renderFloor(t);updateSequence(t);await sleep(260);scene.classList.remove('changing');status.textContent=t==='∞'?'Destination not found.':'Arrived. Opening doors…';await sleep(340);setDoors(false);buttons.forEach(b=>b.disabled=false);buttons.forEach(b=>b.classList.toggle('active',b.dataset.target===t));status.textContent=t==='∞'?'Outside service area.':'Doors open. Choose a floor.';busy=false}
    buttons.forEach(b=>b.addEventListener('click',()=>travelTo(b.dataset.target)));doorBtn.addEventListener('click',()=>{if(busy)return;setDoors(!doorsClosed);status.textContent=doorsClosed?'Doors manually closed.':'Doors open. Choose a floor.'});alarmBtn.addEventListener('click',()=>{shell.classList.add('shake');setTimeout(()=>shell.classList.remove('shake'),450);status.textContent='Alarm acknowledged by nobody.';flashHint('No response from building control.');try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;alarmContext??=new AC();const o=alarmContext.createOscillator(),g=alarmContext.createGain();o.type='square';o.frequency.value=440;g.gain.setValueAtTime(.035,alarmContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,alarmContext.currentTime+.42);o.connect(g).connect(alarmContext.destination);o.start();o.stop(alarmContext.currentTime+.42)}catch(_){}});if(unlocked){infinityBtn.classList.remove('locked');infinityBtn.setAttribute('aria-disabled','false')}renderFloor('0');setTimeout(()=>flashHint('Try the maintenance floor if you get lost.'),1800)
  })();
  </script>
