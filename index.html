<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efdf">
<title>FEED THE VOID</title>
<style>
:root{--paper:#f4efdf;--ink:#181817;--pink:#ff6fae;--blue:#83d8ff;--acid:#dfff57;--orange:#ff9b54}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:var(--paper);color:var(--ink);touch-action:none;cursor:crosshair}.world{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 20% 10%,#fff 0 1px,transparent 2px),linear-gradient(135deg,#f7f2e6,#ece4cf);background-size:31px 31px,auto;transition:filter .6s,background .6s}.noise{position:absolute;inset:0;pointer-events:none;opacity:.1;background-image:repeating-linear-gradient(0deg,transparent 0 2px,#000 3px);mix-blend-mode:multiply}.top{position:absolute;z-index:20;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;pointer-events:none}.title{font-weight:1000;font-size:clamp(1.6rem,4vw,3.8rem);letter-spacing:-.07em;line-height:.82;text-transform:uppercase}.title small{display:block;margin-top:.65rem;font:700 .62rem/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#555;text-transform:uppercase}.counter{background:#181817;color:#fff;border-radius:999px;padding:.7rem 1rem;font:800 .72rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.07em;white-space:nowrap}.void-wrap{position:absolute;z-index:5;left:50%;top:50%;width:min(36vw,340px);aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center;filter:drop-shadow(0 20px 30px #0003)}.rings{position:absolute;inset:-25%;animation:spin 15s linear infinite}.ring{position:absolute;inset:var(--i);border:2px solid #181817;border-radius:47% 53% 48% 52%/54% 44% 56% 46%;opacity:calc(.36 - var(--n)*.06);animation:wobble calc(3s + var(--n)*.7s) ease-in-out infinite alternate}.hole{position:relative;width:68%;aspect-ratio:1;border-radius:48% 52% 46% 54%/53% 45% 55% 47%;background:#050505;box-shadow:inset 18px 12px 25px #3338,inset -12px -8px 22px #000,0 0 0 5px #181817;display:grid;place-items:center;transform:scale(var(--pulse,1));transition:transform .2s}.hole::after{content:'';position:absolute;inset:17%;border-radius:50%;background:#000;box-shadow:0 0 45px #000}.mouth{z-index:2;color:#fff;font-weight:1000;font-size:clamp(.75rem,1.8vw,1rem);letter-spacing:.14em;text-align:center;text-transform:uppercase;opacity:.8;pointer-events:none}.object{position:absolute;z-index:10;width:112px;min-height:72px;padding:12px;border:3px solid #181817;border-radius:18px;background:#fff;box-shadow:7px 7px 0 #181817;display:grid;place-items:center;text-align:center;font-weight:900;font-size:.78rem;line-height:1.05;cursor:grab;touch-action:none;user-select:none;transform:translate(-50%,-50%) rotate(var(--r));transition:box-shadow .15s,filter .2s,opacity .25s,scale .25s}.object:hover{box-shadow:11px 11px 0 #181817;z-index:15}.object.dragging{cursor:grabbing;box-shadow:14px 16px 0 #181817;z-index:100;scale:1.08}.object .emoji{display:block;font-size:2.05rem;line-height:1;margin-bottom:7px}.object.eaten{pointer-events:none;opacity:0;scale:.05;filter:blur(8px);transition:transform .45s cubic-bezier(.4,1.6,.5,1),opacity .42s,scale .42s,filter .42s}.toast{position:absolute;z-index:60;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#181817;color:#fff;padding:.72rem 1rem;border-radius:10px;font:800 .7rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:min(88vw,560px)}.toast.on{opacity:1;transform:translate(-50%,0)}.instructions{position:absolute;z-index:20;left:18px;bottom:max(18px,env(safe-area-inset-bottom));font:700 .58rem/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#6a6255;pointer-events:none}.button{position:absolute;z-index:25;right:18px;bottom:max(18px,env(safe-area-inset-bottom));border:3px solid #181817;border-radius:999px;background:var(--acid);box-shadow:5px 5px 0 #181817;padding:.7rem 1rem;font:900 .68rem ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;text-transform:uppercase}.button:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #181817}.stamp{position:absolute;right:18px;top:94px;z-index:20;border:3px solid #181817;padding:.4rem .55rem;transform:rotate(5deg);font:1000 .58rem ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;background:#fff;color:#181817}.end{position:fixed;inset:0;z-index:200;background:#050505;color:#fff;display:grid;place-items:center;text-align:center;padding:28px;opacity:0;pointer-events:none;transition:opacity .7s}.end.on{opacity:1;pointer-events:auto}.end h1{margin:0;font-size:clamp(4rem,18vw,13rem);line-height:.72;letter-spacing:-.1em}.end p{font:700 .72rem/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:#aaa;margin:2rem 0}.spit{border:2px solid #fff;background:#fff;color:#000;border-radius:999px;padding:.9rem 1.2rem;font:900 .72rem ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;text-transform:uppercase}.orbit{position:absolute;z-index:3;border:2px dashed #18181755;border-radius:50%;left:50%;top:50%;width:min(63vw,620px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;animation:spin 25s linear infinite}.crumb{position:fixed;z-index:300;width:18px;height:18px;border:2px solid #181817;border-radius:4px;pointer-events:none;animation:fly .9s cubic-bezier(.12,.8,.2,1) forwards}.glitch .world{filter:hue-rotate(145deg) contrast(1.25)}.glitch .title{transform:scaleX(-1)}.tiny .object{font-size:.58rem}.hungry .hole{animation:hunger .32s ease-in-out infinite alternate}.secret{position:absolute;z-index:50;left:50%;top:12px;transform:translateX(-50%) rotate(-1deg);background:var(--pink);border:3px solid #181817;box-shadow:5px 5px 0 #181817;padding:.55rem .85rem;font:900 .63rem ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;display:none}.admin .secret{display:block}@keyframes spin{to{transform:rotate(360deg)}}@keyframes wobble{to{transform:rotate(25deg) scale(1.03)}}@keyframes hunger{to{transform:scale(1.07) rotate(2deg)}}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--rot));opacity:0}}@media(max-width:720px){.void-wrap{width:min(58vw,290px)}.orbit{width:85vw}.object{width:91px;min-height:62px;padding:9px;font-size:.66rem;border-width:2px;box-shadow:5px 5px 0 #181817}.object .emoji{font-size:1.65rem}.instructions{display:none}.stamp{top:auto;bottom:72px;right:15px}.button{right:14px;bottom:14px}.top{left:14px;right:14px}.title small{max-width:210px}.counter{font-size:.62rem;padding:.58rem .78rem}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="world" id="world">
  <div class="noise"></div>
  <div class="top"><div class="title">FEED<br>THE VOID<small>drag useless things into the hole</small></div><div class="counter" id="counter">VOID: 0 / 13</div></div>
  <div class="stamp">nothing is saved*</div>
  <div class="orbit"></div>
  <div class="void-wrap" id="voidWrap"><div class="rings"><div class="ring" style="--i:6%;--n:1"></div><div class="ring" style="--i:14%;--n:2"></div><div class="ring" style="--i:22%;--n:3"></div></div><div class="hole" id="hole"><div class="mouth" id="mouth">FEED ME<br>ABSOLUTELY NOTHING</div></div></div>
  <div class="instructions">drag with mouse / finger<br>click the void if impatient</div>
  <button class="button" id="spawn">+ more junk</button>
  <div class="secret">VOID ADMIN ENABLED — appetite ×2</div>
  <div class="toast" id="toast"></div>
</div>
<div class="end" id="end"><div><h1>FULL.</h1><p>The void has consumed enough nonsense for today.<br>It has learned nothing.</p><button class="spit" id="spit">spit everything back out</button></div></div>
<script>
(()=>{
const items=[
['🧦','ONE LONELY SOCK'],['📎','A PAPERCLIP WITH AMBITIONS'],['🌙','THE MOON (SMALL)'],['🧾','A RECEIPT FROM 2019'],['🪫','3% BATTERY'],['🍕','LAST SLICE'],['🌀','A LOADING SPINNER'],['🫠','MONDAY'],['📦','BOX LABELED “BOX”'],['🔑','KEY TO NOTHING'],['🦆','SUSPICIOUS DUCK'],['💾','FINAL_final_v7'],['🧠','ONE BAD IDEA'],['🪨','PREMIUM ROCK'],['📡','NO SIGNAL'],['🥄','THE GOOD SPOON'],['🧩','WRONG PUZZLE PIECE'],['👁️','UNSKIPPABLE EYE CONTACT'],['🧃','EMPTY JUICE BOX'],['🖱️','A SECOND CURSOR'],['🛒','ABANDONED CART'],['🗂️','UNTITLED FOLDER'],['⏰','ALARM SET FOR 06:00'],['🧻','ONE SQUARE'],['📍','YOU ARE NOT HERE'],['🫧','TERMS & CONDITIONS']];
const colors=['#ff6fae','#83d8ff','#dfff57','#ff9b54','#c6a6ff','#fff','#ffe36e'];
const world=document.querySelector('#world'),hole=document.querySelector('#hole'),wrap=document.querySelector('#voidWrap'),counter=document.querySelector('#counter'),toast=document.querySelector('#toast'),end=document.querySelector('#end');
let eaten=0,spawned=0,voidClicks=0,admin=false,word='';
const active=new Set();
function tell(text){toast.textContent=text;toast.classList.add('on');clearTimeout(tell.t);tell.t=setTimeout(()=>toast.classList.remove('on'),1500)}
function pos(){const pad=95,w=innerWidth,h=innerHeight;let x,y,tries=0;do{x=pad+Math.random()*Math.max(40,w-pad*2);y=pad+Math.random()*Math.max(40,h-pad*2);tries++}while(Math.hypot(x-w/2,y-h/2)<Math.min(w,h)*.22&&tries<20);return[x,y]}
function spawnOne(burst=false){const data=items[spawned%items.length];spawned++;const el=document.createElement('div');el.className='object';const [x,y]=pos();el.style.left=x+'px';el.style.top=y+'px';el.style.background=colors[(spawned*3)%colors.length];el.style.setProperty('--r',`${-9+Math.random()*18}deg`);el.innerHTML=`<span><span class="emoji">${data[0]}</span>${data[1]}</span>`;world.appendChild(el);active.add(el);drag(el);if(burst){el.animate([{transform:'translate(-50%,-50%) scale(0) rotate(-40deg)'},{transform:`translate(-50%,-50%) scale(1) rotate(${el.style.getPropertyValue('--r')})`}],{duration:420,easing:'cubic-bezier(.2,1.7,.3,1)'})}return el}
function drag(el){let dx=0,dy=0,down=false;el.addEventListener('pointerdown',e=>{down=true;el.setPointerCapture(e.pointerId);const r=el.getBoundingClientRect();dx=e.clientX-(r.left+r.width/2);dy=e.clientY-(r.top+r.height/2);el.classList.add('dragging')});el.addEventListener('pointermove',e=>{if(!down)return;el.style.left=(e.clientX-dx)+'px';el.style.top=(e.clientY-dy)+'px';const hr=hole.getBoundingClientRect(),er=el.getBoundingClientRect(),a={x:hr.left+hr.width/2,y:hr.top+hr.height/2},b={x:er.left+er.width/2,y:er.top+er.height/2};const d=Math.hypot(a.x-b.x,a.y-b.y);hole.style.setProperty('--pulse',d<hr.width*.8?'1.12':'1')});el.addEventListener('pointerup',e=>{down=false;el.classList.remove('dragging');hole.style.setProperty('--pulse','1');const hr=hole.getBoundingClientRect(),er=el.getBoundingClientRect(),a={x:hr.left+hr.width/2,y:hr.top+hr.height/2},b={x:er.left+er.width/2,y:er.top+er.height/2};if(Math.hypot(a.x-b.x,a.y-b.y)<hr.width*.58)consume(el)})}
function crumbs(x,y){for(let i=0;i<9;i++){const c=document.createElement('i');c.className='crumb';c.style.left=x+'px';c.style.top=y+'px';c.style.background=colors[i%colors.length];c.style.setProperty('--x',`${-90+Math.random()*180}px`);c.style.setProperty('--y',`${-90+Math.random()*180}px`);c.style.setProperty('--rot',`${Math.random()*540-270}deg`);document.body.appendChild(c);setTimeout(()=>c.remove(),950)}}
function consume(el){if(!active.has(el))return;active.delete(el);const r=el.getBoundingClientRect(),h=hole.getBoundingClientRect();el.style.left=(h.left+h.width/2)+'px';el.style.top=(h.top+h.height/2)+'px';el.classList.add('eaten');crumbs(r.left+r.width/2,r.top+r.height/2);eaten+=admin?2:1;if(eaten>13)eaten=13;counter.textContent=`VOID: ${eaten} / 13`;navigator.vibrate?.(35);const comments=['acceptable.','that was probably important.','more.','deliciously pointless.','the void refuses to elaborate.','object permanence disabled.'];tell(comments[eaten%comments.length]);mutate();setTimeout(()=>el.remove(),500);if(eaten>=13)setTimeout(()=>end.classList.add('on'),750)}
function mutate(){document.body.classList.toggle('tiny',eaten>=4&&eaten<7);document.body.classList.toggle('glitch',eaten>=7&&eaten<10);document.body.classList.toggle('hungry',eaten>=10);document.querySelector('#mouth').innerHTML=eaten<4?'FEED ME<br>ABSOLUTELY NOTHING':eaten<7?'STILL<br>EMPTY':eaten<10?'YOU SHOULD<br>STOP':eaten<13?'MORE.':'ENOUGH.';if(eaten===4)tell('the labels are getting nervous.');if(eaten===7)tell('color calibration has left the building.');if(eaten===10)tell('the void is now actively hungry.')}
function reset(){end.classList.remove('on');eaten=0;spawned=0;active.forEach(x=>x.remove());active.clear();document.body.className=admin?'admin':'';counter.textContent='VOID: 0 / 13';mutate();for(let i=0;i<8;i++)setTimeout(()=>spawnOne(true),i*70);tell('everything has been irresponsibly restored.')}
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.object'))return;voidClicks++;hole.animate([{transform:'scale(1)'},{transform:'scale(.88)'},{transform:'scale(1)'}],{duration:260});const nags=['ow.','that is not food.','please use an object.','you clicked a hole. congratulations.','still a hole.','no secret button here.'];tell(nags[Math.min(voidClicks-1,nags.length-1)]);if(voidClicks===7){spawnOne(true);tell('fine. have a suspicious bonus object.')}});
document.querySelector('#spawn').onclick=()=>{for(let i=0;i<3;i++)setTimeout(()=>spawnOne(true),i*90)};document.querySelector('#spit').onclick=reset;
addEventListener('keydown',e=>{word=(word+e.key.toLowerCase()).slice(-4);if(word==='void'&&!admin){admin=true;document.body.classList.add('admin');tell('VOID ADMIN enabled. terrible idea.')}});
for(let i=0;i<8;i++)spawnOne();
})();
</script>
</body>
</html>
