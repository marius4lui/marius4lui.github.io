<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15120f">
<title>SERVICE ELEVATOR / FLOOR ∞</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#0c0b09;color:#eadfc9;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.app{height:100dvh;display:grid;grid-template-columns:1fr 270px;background:linear-gradient(100deg,#1a1612,#0b0a09 72%)}.shaft{position:relative;min-width:0;overflow:hidden;border-right:1px solid #51483c}.scene{position:absolute;inset:0;display:grid;place-items:center;padding:60px;background:#26211d;transition:.5s background}.content{max-width:700px;text-align:center;z-index:2;transition:.35s opacity,.35s transform}.scene.busy .content{opacity:0;transform:scale(.97)}h1{font-size:clamp(3rem,11vw,8rem);line-height:.85;margin:0;letter-spacing:-.08em}h2{margin:.7rem 0 0;text-transform:uppercase;letter-spacing:.16em;font-size:clamp(1rem,2vw,1.6rem)}p{line-height:1.65;color:#c0b5a2}.frame{position:absolute;inset:24px;border:18px solid #312b25;box-shadow:inset 0 0 0 2px #706557,inset 0 0 90px #0008;pointer-events:none;z-index:8}.door{position:absolute;top:42px;bottom:42px;width:calc(50% - 24px);z-index:7;background:linear-gradient(90deg,#59534c,#312e2a 45%,#49443e);transition:1s cubic-bezier(.76,0,.24,1);box-shadow:inset 0 0 35px #0008}.door.l{left:24px;transform:translateX(-101%)}.door.r{right:24px;transform:translateX(101%)}.closed .door{transform:translateX(0)}.plaque{position:absolute;z-index:9;top:12px;left:50%;transform:translateX(-50%);background:#0b0a08;border:1px solid #574a36;padding:.4rem 1rem;color:#e7b64c;letter-spacing:.22em;font-size:.7rem}.panel{padding:24px 20px;background:linear-gradient(90deg,#2a241e,#191612);display:flex;flex-direction:column;gap:14px;overflow:auto}.brand{font:700 .72rem Arial,sans-serif;letter-spacing:.2em;color:#e8ddca;border-bottom:1px solid #4c4237;padding-bottom:12px}.display{background:#080706;border:1px solid #4d4233;padding:12px;box-shadow:inset 0 0 25px #000}.display .row{display:flex;align-items:center;justify-content:space-between}.num{font-size:2.7rem;color:#f2bd43;text-shadow:0 0 14px #e0a52c66}.dir{color:#8e742f}.status{font-size:.58rem;color:#806f52;text-transform:uppercase;letter-spacing:.11em;margin-top:6px;line-height:1.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px}.floor{aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;color:#ddd1bf;font-weight:700;font-size:1rem;background:radial-gradient(circle at 36% 30%,#6b645b,#39342f 35%,#111 75%);box-shadow:inset 0 0 0 2px #756c60,inset 0 0 0 6px #1a1714,0 5px 0 #080706}.floor:active{transform:translateY(3px)}.floor.active{color:#ffd466;text-shadow:0 0 9px #e9b84d}.floor.lock{opacity:.3}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools button{background:#171411;border:1px solid #51483c;color:#a99b86;padding:10px;cursor:pointer;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em}.note{margin-top:auto;font-size:.52rem;line-height:1.5;color:#74695a;text-transform:uppercase;letter-spacing:.08em}.hint{position:fixed;left:18px;bottom:18px;background:#080706dd;border:1px solid #594c3a;padding:.7rem 1rem;color:#cdbd9e;font-size:.65rem;z-index:20;opacity:0;transform:translateY(8px);transition:.25s}.hint.on{opacity:1;transform:none}.shake{animation:shake .35s linear}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-2px)}}
.scene[data-floor="0"]{background:linear-gradient(120deg,#403b37,#171513)}.scene[data-floor="-1"]{background:#171513}.scene[data-floor="7"]{background:linear-gradient(#141d27,#06080c)}.scene[data-floor="13"]{background:linear-gradient(#0e5769,#042a38 65%,#02171e)}.scene[data-floor="?"]{background:#15100f}.scene[data-floor="∞"]{background:radial-gradient(circle at 50% 45%,#282052,#07060e 58%,#000)}.archive{border:1px solid #5b5044;background:#201c18;padding:2rem;text-align:left}.archive b{color:#e6b955}.rain{position:absolute;inset:-20%;background:repeating-linear-gradient(110deg,transparent 0 22px,#b9d7ff22 23px,#b9d7ff22 24px);animation:rain .5s linear infinite}@keyframes rain{to{transform:translate(35px,70px)}}.bubble{position:absolute;border:1px solid #d8fbff66;border-radius:50%;animation:up var(--d) linear infinite;left:var(--x);bottom:-40px;width:var(--s);height:var(--s)}@keyframes up{to{transform:translateY(-120vh) translateX(30px)}}code{color:#e5b64c}.secret{display:inline-block;margin-top:1rem;border:1px solid #786da5;padding:.5rem .8rem;color:#bcb1ff;font-size:.68rem}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:31px 31px;animation:drift 8s linear infinite;opacity:.45}@keyframes drift{to{transform:scale(1.35) rotate(5deg)}}
@media(max-width:720px){.app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 235px}.panel{display:grid;grid-template-columns:130px 1fr;grid-template-rows:auto 1fr;padding:12px;gap:9px}.brand{grid-column:1/-1;padding-bottom:7px}.display{grid-row:2;grid-column:1}.grid{grid-row:2;grid-column:2;grid-template-columns:repeat(3,1fr);gap:7px;padding:0}.floor{font-size:.8rem}.tools,.note{display:none}.frame{inset:12px;border-width:10px}.door{top:22px;bottom:22px;width:calc(50% - 12px)}.door.l{left:12px}.door.r{right:12px}.scene{padding:44px 28px}.plaque{top:4px}}
</style>
</head>
<body>
<div class="app" id="app">
  <main class="shaft" id="shaft">
    <div class="scene" id="scene" data-floor="0"><div class="content" id="content"></div></div>
    <div class="door l"></div><div class="door r"></div><div class="frame"></div>
    <div class="plaque">SERVICE ELEVATOR</div>
  </main>
  <aside class="panel">
    <div class="brand">BUILDING 04 / SERVICE CORE</div>
    <div class="display"><div class="row"><span class="num" id="num">0</span><span class="dir" id="dir">◆</span></div><div class="status" id="status">Doors open. Choose a floor.</div></div>
    <div class="grid">
      <button class="floor" data-f="-1">-1</button><button class="floor active" data-f="0">0</button><button class="floor" data-f="7">7</button><button class="floor" data-f="13">13</button><button class="floor" data-f="?">?</button><button class="floor lock" id="inf" data-f="∞">∞</button>
    </div>
    <div class="tools"><button id="door">Close doors</button><button id="alarm">Alarm</button></div>
    <div class="note">Inspection overdue by 4,821 days.<br>Do not service unlisted floors.</div>
  </aside>
</div><div class="hint" id="hint"></div>
<script>
(()=>{const app=document.querySelector('#app'),shaft=document.querySelector('#shaft'),scene=document.querySelector('#scene'),content=document.querySelector('#content'),num=document.querySelector('#num'),dir=document.querySelector('#dir'),status=document.querySelector('#status'),inf=document.querySelector('#inf'),hint=document.querySelector('#hint'),door=document.querySelector('#door');let floor='0',busy=false,seq=[],unlocked=localStorage.getItem('daily-elevator-inf')==='1';const req=['7','13','-1','0'];const bubble=()=>Array.from({length:20},(_,i)=>`<i class="bubble" style="--x:${(i*47)%96}%;--s:${6+(i*11)%24}px;--d:${7+(i%8)}s;animation-delay:-${i%9}s"></i>`).join('');const pages={
'0':()=>`<div><h1>0</h1><h2>Lobby</h2><p>The directory lists twelve floors. The panel lists five. Nobody has explained this.</p></div>`,
'-1':()=>`<div class="archive"><h2>Archive / B1</h2><p>Cabinet 44 contains reports dated next Thursday.</p><p><b>FILE 44-C:</b> “Visitor entered elevator. Visitor ignored instructions.”</p></div>`,
'7':()=>`<div class="rain"></div><div><h1>7°</h1><h2>Indoor weather</h2><p>Rain continues inside the building. Chance of hallway: 82%.</p></div>`,
'13':()=>`${bubble()}<div><h1>13</h1><h2>Water level</h2><p>The doors are rated for thirty meters. You are not thirty meters below anything.</p></div>`,
'?':()=>`<div class="archive"><h2>Maintenance access</h2><p>Camera: OFFLINE<br>Interlock: UNKNOWN</p><p>Calibration sequence: <code>7 → 13 → -1 → 0</code></p><p>Technician note: if ∞ appears, do not acknowledge it.</p></div>`,
'∞':()=>`<div class="stars"></div><div><h1>∞</h1><h2>Outside service area</h2><p>There is no building outside these doors.</p><span class="secret">You found the floor that is not on the plan.</span></div>`};function flash(t){hint.textContent=t;hint.classList.add('on');clearTimeout(flash.t);flash.t=setTimeout(()=>hint.classList.remove('on'),1700)}function setDoors(c){shaft.classList.toggle('closed',c);door.textContent=c?'Open doors':'Close doors'}function render(f){scene.dataset.floor=f;content.innerHTML=pages[f]()}function check(f){if(f==='?')return;seq.push(f);seq=seq.slice(-4);if(!unlocked&&seq.join('|')===req.join('|')){unlocked=true;localStorage.setItem('daily-elevator-inf','1');inf.classList.remove('lock');flash('A new floor appeared.')}}async function go(t){if(busy||t===floor)return;if(t==='∞'&&!unlocked){app.classList.add('shake');setTimeout(()=>app.classList.remove('shake'),400);flash('That button does not exist yet.');return}busy=true;status.textContent='Closing doors…';setDoors(true);await wait(950);scene.classList.add('busy');dir.textContent='◇';status.textContent='Moving…';for(let i=0;i<5;i++){num.textContent=['--','04','ERR','?','…'][Math.floor(Math.random()*5)];await wait(150)}floor=t;num.textContent=t;render(t);check(t);await wait(250);scene.classList.remove('busy');status.textContent=t==='∞'?'Destination not found.':'Arrived. Opening doors…';await wait(300);setDoors(false);document.querySelectorAll('.floor').forEach(b=>b.classList.toggle('active',b.dataset.f===t));status.textContent=t==='∞'?'Outside service area.':'Doors open. Choose a floor.';dir.textContent='◆';busy=false}const wait=ms=>new Promise(r=>setTimeout(r,ms));document.querySelectorAll('.floor').forEach(b=>b.onclick=()=>go(b.dataset.f));door.onclick=()=>{if(!busy){const c=!shaft.classList.contains('closed');setDoors(c);status.textContent=c?'Doors manually closed.':'Doors open. Choose a floor.'}};document.querySelector('#alarm').onclick=()=>{app.classList.add('shake');setTimeout(()=>app.classList.remove('shake'),400);flash('Alarm acknowledged by nobody.');status.textContent='No response from building control.'};if(unlocked)inf.classList.remove('lock');render('0');setTimeout(()=>flash('Maintenance may know more.'),1400)})();
</script>
</body>
</html>
